<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.css" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>

<div class="max-w-sm mx-auto bg-white rounded-xl shadow p-4">
  <!-- Mois courant -->
  <div id="monthLabel" class="text-center text-lg font-semibold mb-2"></div>

  <!-- Boutons navigation -->
  <div class="flex justify-between mb-2">
    <button id="prevBtn" class="px-4 py-2 bg-orange text-white font-semibold rounded hover:bg-terre">&lt;</button>
    <button id="todayBtn" class="px-4 py-2 bg-orange text-white font-semibold rounded hover:bg-terre">Aujourd’hui</button>
    <button id="nextBtn" class="px-4 py-2 bg-orange text-white font-semibold rounded hover:bg-terre">&gt;</button>
  </div>

  <!-- Conteneur du calendrier -->
  <div id="calendar"></div>
</div>

<script>
const sessions = JSON.parse('{{ sessions_dates|escapejs }}');
const activityColors = {
  "Dressage": "#4caf50",
  "Saut": "#f59e0b",
  "Balade": "#3b82f6",
  "Autre": "#9ca3af"
};

const calendar = new FullCalendar.Calendar(document.getElementById('calendar'), {
  initialView: 'dayGridMonth',
  locale: 'fr',
  headerToolbar: false, // on gère nos propres boutons
  events: sessions.map(
    s => ({
      id: s.id,
      title: s.activity,
      date: s.date,
      backgroundColor: activityColors[s.activity] || activityColors["Autre"],
      borderColor: activityColors[s.activity] || activityColors["Autre"],
      textColor: 'white'
    })),
  eventClick: function(info) {
    // Redirige vers le formulaire d'édition de la séance
    const sessionId = info.event.id;
    window.location.href = `/entrainement/${sessionId}/edit/`;
  },
  dateClick: function(info) {
    // Redirige TOUJOURS vers le formulaire d'ajout avec la date cliquée
    // (même si le jour a déjà des événements - on clique entre les tags)
    const dateISO = info.dateStr;
    window.location.href = `{% url 'training_add_global' %}?date=${dateISO}`;
  },
  height: 'auto',
  dayMaxEvents: 5,  // Affiche jusqu'à 5 événements avant le "+"
  moreLinkClick: 'popover',  // Affiche les autres dans un popover
  dayMaxEventRows: 3,  // Nombre max de lignes d'événements avant scroll
});

// Rendu du calendrier
calendar.render();

// Afficher le mois courant
function updateMonthLabel() {
  document.getElementById('monthLabel').textContent =
    calendar.getDate().toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' });
}
updateMonthLabel();

// Gestion des boutons
document.getElementById('prevBtn').addEventListener('click', () => {
  calendar.prev();
  updateMonthLabel();
});
document.getElementById('nextBtn').addEventListener('click', () => {
  calendar.next();
  updateMonthLabel();
});
document.getElementById('todayBtn').addEventListener('click', () => {
  calendar.today();
  updateMonthLabel();
});
</script>

<style>
/* Mini-calendrier compact */
.fc .fc-daygrid-day-number {
  @apply text-xs;
  font-weight: bold;
}
.fc .fc-daygrid-day {
  @apply p-0.5;
  min-height: 60px;
}
/* Curseur pointer sur les jours cliquables */
.fc-daygrid-day {
  cursor: pointer;
}
.fc-daygrid-day:hover {
  background-color: #f3f4f6;
}
/* Style des événements comme des petits tags de même largeur */
.fc-event {
  cursor: pointer;
  font-size: 10px;
  padding: 2px 4px;
  margin: 1px;
  border-radius: 4px;
  text-align: center;
  white-space: nowrap;
  box-shadow: 0 1px 2px rgba(0,0,0,0.1);
  font-weight: 500;
  width: 30px;
  overflow: hidden;
  text-overflow: ellipsis;
}
/* pour plusieurs événements sur un même jour */
.fc-daygrid-day-events {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  width: 100%;
}
</style>
